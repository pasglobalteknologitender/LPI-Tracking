services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lpi
      POSTGRES_PASSWORD: lpi
      POSTGRES_DB: lpi_tracking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lpi -d lpi_tracking']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://lpi:lpi@postgres:5432/lpi_tracking
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3100}
      FILE_STORAGE_PATH: /app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    volumes:
      - uploads_data:/app/data/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        API_URL: http://api:3001
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3100}
    environment:
      NODE_ENV: production
      API_URL: http://api:3001
      PORT: 3100
      HOSTNAME: 0.0.0.0
    ports:
      - '3100:3100'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
