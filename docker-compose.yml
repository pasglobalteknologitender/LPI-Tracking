services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lpi
      POSTGRES_PASSWORD: lpi
      POSTGRES_DB: lpi_tracking
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lpi -d lpi_tracking']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
